# Board ITSM + banco do sistema (MySQL).
#   Subir/atualizar:  docker compose up -d --build
#   Parar:            docker compose down          (os dados são mantidos nos volumes)
#   ATENÇÃO: nunca use "docker compose down -v" — o -v apaga os volumes com os dados.
#   Backup (MySQL):   docker compose exec mysql sh -c 'mysqldump -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --single-transaction --no-tablespaces --hex-blob "$$MYSQL_DATABASE"' > backup.sql
name: itsm-board

services:
  # Banco do sistema: Planejamento + Gestão de Projetos
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-board}
      MYSQL_USER: ${MYSQL_DB_USER:-board}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:?defina MYSQL_DB_PASSWORD no .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"          # root não é usado pela aplicação
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00               # datas gravadas em UTC
      - --max-allowed-packet=64M                 # anexos de até 20 MB
    volumes:
      - mysql-data:/var/lib/mysql              # volume nomeado: sobrevive a restart, down e rebuild
    ports:
      - "127.0.0.1:${MYSQL_DB_PORT_HOST:-3316}:3306" # só na máquina local (ferramentas / backup)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  board:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DB_HOST: mysql
      MYSQL_DB_PORT: "3306"
    ports:
      - "5080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
    name: itsm-board-mysql-data
